<h1>Pawn turning study</h1>
<p>The accepted foot is 2.8% wider and the pawn is 1.8% shorter than checkpoint 003. Each trial uses the same floor and the same 54° reference camera.</p>
<section>
<h2>Proportions in profile</h2>
<figure><a href="proportions.png"><img src="proportions.png" width="1200" height="421" alt="Five level pawn renders, from the previous design through the width and height trials to the accepted pawn. Each foot diameter and total height are labeled."></a>
<figcaption>One scale for all five pieces. The labels give foot diameter and total height in Blender units.</figcaption></figure>
</section>
<section>
<h2>The shared base</h2>
<figure><a href="donor-bases.png"><img src="donor-bases.png" width="1132" height="227" alt="Level close-ups of the previous pawn, queen, king and accepted pawn with equally wide feet and a common floor."></a>
<figcaption>Equal displayed foot diameters bring the single groove, rolled flare and socket into register. The pawn uses all 39 rings of the approved turning and its first stem support.</figcaption></figure>
</section>
<section>
<h2>Against the original</h2>
<figure><a href="source-comparison.png"><img src="source-comparison.png" width="992" height="368" alt="Original Lichess sprite, selected black candidate 2, previous pawn render and accepted pawn render from the same registered view."></a>
<figcaption>Compared at the sprite’s native size, the front of the foot is within 0.2 pixel vertically. The socket edge and foot groove sit about four pixels lower in the accepted render.</figcaption></figure>
