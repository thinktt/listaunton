<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staunton — Set comparison</title><style>
:root{color-scheme:dark;font:15px/1.5 system-ui;background:#10110f;color:#eeeae1}*{box-sizing:border-box}body{margin:0}main{max-width:1900px;margin:auto;padding:20px}header{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px}h1{font-size:25px;margin:8px 0}a{color:#d7ad77}button,select{font:inherit;color:inherit;background:#252a22;border:1px solid #535b48;padding:8px 12px;border-radius:6px}button{cursor:pointer}button[aria-pressed=true]{background:#d7ad77;color:#171710}button:focus-visible,select:focus-visible{outline:3px solid #f1c37f;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid #363a31;border-radius:10px;padding:12px;background:#1a1c18;min-width:0}.card h2{font-size:18px;margin:0 0 10px}.card select{width:100%;margin-bottom:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.frame{position:relative;width:100%;max-width:300px;aspect-ratio:1;background:var(--canvas,#000);overflow:hidden;margin:auto}.frame img{position:absolute;max-width:none;height:auto;display:block}.caption{text-align:center;color:#b1b4a9;font-size:12px;margin-top:6px}.empty{position:absolute;inset:0;display:grid;place-content:center;padding:15px;text-align:center;color:#b1b4a9;font-size:13px}.note{color:#b1b4a9;font-size:13px;margin:0}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:1250px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}}
[hidden]{display:none!important}.set-tabs{display:flex;gap:8px;margin:0 0 18px;border-bottom:1px solid #363a31;padding-bottom:14px}button[aria-selected=true]{background:#d7ad77;color:#171710}.side-image{display:block;background:#171717;border-radius:6px;overflow:hidden}.side-image img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}.side-links{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;padding-top:12px}.side-card h2{margin-bottom:12px}.side-note{margin:0 0 16px;color:#b1b4a9;font-size:13px}.side-image:focus-visible,.side-links a:focus-visible{outline:3px solid #f1c37f;outline-offset:3px}
</style></head><body><main><header><div><a href="index.html">← Home</a> · <span id="projection-links">Proportions: <a href="king-projections.html">King</a> · <a href="queen-projections.html">Queen</a> · <a href="rook-projections.html">Rook</a></span><h1>Set comparison</h1><p id="view-note" class="note">Candidate beside original · matched scale · up to 300 px per image</p></div><div id="comparison-tools" class="tools"><button id="black" aria-pressed="true">Black pieces</button><button id="white" aria-pressed="false">White pieces</button><label>Background <select id="background"><option value="#000">Black</option><option value="#565850">Gray</option><option value="#ddd">Light</option></select></label></div></header><div class="set-tabs" role="tablist" aria-label="Whole-set view"><button id="tab-comparison" role="tab" aria-selected="true" aria-controls="panel-comparison" tabindex="0">Reference comparison</button><button id="tab-side-views" role="tab" aria-selected="false" aria-controls="panel-side-views" tabindex="-1">Side views</button></div><section id="panel-comparison" role="tabpanel" aria-labelledby="tab-comparison"><div id="grid" class="grid"></div></section><section id="panel-side-views" role="tabpanel" aria-labelledby="tab-side-views" hidden><p class="side-note">Each image has its own framing; these are not shown at a shared physical scale.</p><div class="grid">__SIDE_CARDS__</div></section></main><script id="set-data" type="application/json">__DATA__</script><script>
(()=>{'use strict';const data=JSON.parse(document.getElementById('set-data').textContent),grid=document.getElementById('grid');let color='black';const choices={black:{king:'candidate-1',rook:'candidate-8',knight:'candidate-2',pawn:'candidate-2'},white:{bishop:'white-candidate-3'}};
function layout(item,original){let scale=item.scale/original.scale,x=(item.x-original.x)/original.scale,y=(item.y-original.y)/original.scale;const flip=Boolean(item.flip)!==Boolean(original.flip);if(original.flip)x=100-x-scale*100;return {scale,x,y,flip};}
function picture(frame,item,placement){frame.replaceChildren();if(!item){const msg=document.createElement('span');msg.className='empty';msg.textContent='No white queen high-res reference yet';frame.append(msg);return;}const im=document.createElement('img');im.alt=item.label;im.src=item.file;im.style.width=placement.scale*100+'%';im.style.left=placement.x+'%';im.style.top=placement.y+'%';im.style.transform=placement.flip?'scaleX(-1)':'none';frame.append(im);}
function render(){grid.replaceChildren();for(const piece of ['king','queen','rook','bishop','knight','pawn']){const title=piece[0].toUpperCase()+piece.slice(1),queen=piece==='queen',original=queen?{id:color,label:'Original '+color+' queen',file:'references/lichess-staunton-3d/'+(color==='black'?'Black':'White')+'-Queen.png',scale:1,x:0,y:0,flip:false}:data[piece].find(i=>i.id===color);const options=queen?(color==='black'?data.queen:[]):data[piece].filter(i=>i.id.startsWith(color==='black'?'candidate-':'white-candidate-'));const card=document.createElement('section');card.className='card';const heading=document.createElement('h2'),link=document.createElement('a');link.href=queen?'review.html':piece+'-review.html';link.textContent=title;heading.append(link);card.append(heading);const select=document.createElement('select');select.setAttribute('aria-label',title+' candidate');for(const item of options){const option=document.createElement('option');option.value=item.id;option.textContent=item.label;select.append(option);}if(!options.length){const option=document.createElement('option');option.textContent='No candidate available';select.append(option);select.disabled=true;}select.value=options.some(i=>i.id===choices[color][piece])?choices[color][piece]:(options[0]?.id||'');card.append(select);const pair=document.createElement('div');pair.className='pair';const frames=[];for(const caption of ['High-res candidate','Original '+color]){const col=document.createElement('div'),frame=document.createElement('div'),label=document.createElement('div');frame.className='frame';label.className='caption';label.textContent=caption;col.append(frame,label);pair.append(col);frames.push(frame);}card.append(pair);grid.append(card);picture(frames[1],original,{scale:1,x:0,y:0,flip:false});function update(){const item=options.find(i=>i.id===select.value);choices[color][piece]=select.value;picture(frames[0],item,item?layout(item,original):null);}select.addEventListener('change',update);update();}for(const c of ['black','white'])document.getElementById(c).setAttribute('aria-pressed',String(color===c));}
for(const c of ['black','white'])document.getElementById(c).addEventListener('click',()=>{color=c;render();});document.getElementById('background').addEventListener('change',e=>document.documentElement.style.setProperty('--canvas',e.target.value));render();})();
</script>
<script id="set-tabs-runtime">
(()=>{'use strict';
const ids=['comparison','side-views'],byId=id=>document.getElementById(id);
function selectView(name,updateHash=false){
 const next=ids.includes(name)?name:'comparison';
 for(const id of ids){const active=id===next;byId('panel-'+id).hidden=!active;byId('tab-'+id).setAttribute('aria-selected',String(active));byId('tab-'+id).tabIndex=active?0:-1;}
 byId('comparison-tools').hidden=next!=='comparison';
 byId('view-note').textContent=next==='comparison'?'Candidate beside original · matched scale · up to 300 px per image':'GPT-generated side views · imagined from the selected references';
 if(updateHash&&window.location.hash!=='#'+next)window.location.hash=next;
}
for(const [index,id] of ids.entries()){
 const tab=byId('tab-'+id);
 tab.addEventListener('click',()=>selectView(id,true));
 tab.addEventListener('keydown',event=>{
  let next;if(event.key==='ArrowRight'||event.key==='ArrowLeft')next=ids[1-index];else if(event.key==='Home')next=ids[0];else if(event.key==='End')next=ids[1];else return;
  event.preventDefault();selectView(next,true);byId('tab-'+next).focus();
 });
}
window.addEventListener('hashchange',()=>selectView(window.location.hash.slice(1)));
selectView(window.location.hash.slice(1));
})();
</script>
</body></html>
