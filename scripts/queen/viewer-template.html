<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queen — interactive 3D model</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#eceae5;background:#121519}
*{box-sizing:border-box}body{margin:0;min-width:300px}main{height:100vh;height:100dvh;min-height:480px;display:flex;flex-direction:column}
header{padding:20px 26px 16px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #ffffff12;background:#171a1f}
h1{margin:0;font-size:23px;letter-spacing:-.6px;font-weight:600}header p{margin:3px 0 0;color:#a5a8b0;font-size:13px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.group{display:flex;gap:3px;padding:3px;border:1px solid #ffffff15;border-radius:10px;background:#111419}
button,a{font:inherit}button{border:1px solid transparent;background:transparent;color:#c8cbd1;border-radius:7px;padding:7px 11px;cursor:pointer;white-space:nowrap;font-size:13px;line-height:1.2}
button:hover{background:#ffffff0e;color:white}button[aria-pressed="true"]{color:#f5e2bf;background:#564630;border-color:#776043}button:focus-visible,a:focus-visible{outline:2px solid #dab077;outline-offset:3px}
.reset{border-color:#ffffff22;background:#22272e;color:#eceae5;padding:11px 15px}.stage{position:relative;flex:1;min-height:240px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#303842 0%,#1d232b 44%,#101419 100%)}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}canvas:focus-visible{box-shadow:inset 0 0 0 2px #dab077}canvas.dragging{cursor:grabbing}
.views{align-self:center;flex-shrink:0;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 40px);margin:10px 20px;padding:4px;background:#12171c;border:1px solid #ffffff17;border-radius:10px}
.zoom{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:3px;padding:4px;background:#12171cdb;border:1px solid #ffffff17;border-radius:10px}.zoom button{font-size:22px;min-width:38px;padding:3px 8px}
.badge{position:absolute;bottom:20px;left:24px;color:#969fa9;font-size:12px;pointer-events:none;letter-spacing:.2px}
.status{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#151a20e8;padding:30px;text-align:center;color:#d6d9df}.status[hidden]{display:none}
footer{padding:12px 26px;display:flex;gap:16px;justify-content:space-between;align-items:center;border-top:1px solid #ffffff12;background:#171a1f;font-size:12px;color:#9da5af}footer p{margin:0}footer strong{color:#d2d7de;font-weight:500}a{color:#d7b987;text-decoration:none}a:hover{text-decoration:underline}
@media(max-width:720px){header{padding:14px 16px;align-items:flex-start;flex-wrap:wrap;gap:12px}h1{font-size:21px}.controls{gap:8px}header p{font-size:12px}button{padding:7px 9px}.reset{padding:10px 12px}.views{margin:8px 12px;gap:1px;max-width:calc(100% - 24px)}.views button{font-size:12px;padding:7px 8px}footer{padding:10px 16px;align-items:flex-start;gap:10px;font-size:11px}.badge{left:16px;bottom:16px}.zoom{right:12px;bottom:12px}}
</style>

<body>
<main>
<header><div><h1>Queen in 3D</h1><p>Starts at the overlay camera. Drag to explore.</p></div>
<div class="controls"><div class="group" aria-label="Camera projection"><button id="orthographic" aria-pressed="true" title="Parallel projection, as used by the overlay">Orthographic</button><button id="perspective" aria-pressed="false" title="Closer surfaces appear larger">Perspective</button></div><div class="group" aria-label="Surface preview"><button id="neutral" aria-pressed="true">Neutral</button><button id="brown" aria-pressed="false">Wood</button></div><button id="reset" class="reset" title="Return to the overlay camera, zoom and position (R)">Reset view</button></div></header>
<nav class="views" aria-label="View angles"><button data-view="overlay" aria-pressed="true">Overlay camera</button><button data-view="threequarter" aria-pressed="false">3/4 view</button><button data-view="front" aria-pressed="false">Front</button><button data-view="side" aria-pressed="false">Side</button><button data-view="top" aria-pressed="false">Top</button><button data-view="bottom" aria-pressed="false">Underside</button></nav>
<section class="stage" aria-label="Interactive queen model">
<canvas id="viewer" tabindex="0" aria-label="3D queen. Drag to rotate freely, scroll to zoom, shift-drag or right-drag to pan. Arrow keys rotate; plus and minus zoom; R resets."></canvas>
<div class="zoom" aria-label="Zoom controls"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button></div>
<div class="badge" id="surface-note">Overlay camera · neutral surface</div>
<div class="status" id="status" role="status" aria-live="polite">Loading the queen…</div>
</section>
<footer><p><strong>Drag</strong> rotate &nbsp;·&nbsp; <strong>Scroll / pinch</strong> zoom &nbsp;·&nbsp; <strong>Shift-drag / two fingers</strong> pan</p><a id="viewer-model-file" href="models/queen/queen-rebuilt.blend" download>Blender file ↗</a></footer>
</main>
<script id="mesh-metadata" type="application/json">__MESH_META__</script>
<script id="mesh-data" type="application/octet-stream">__MESH_BASE64__</script>
__STUDY_PATCHES__
<script id="wood-data" type="application/octet-stream">__WOOD_BASE64__</script>
<script>
'use strict';
(() => {
const canvas=document.getElementById('viewer'), status=document.getElementById('status');
const meta=JSON.parse(document.getElementById('mesh-metadata').textContent);
const gl=canvas.getContext('webgl2',{antialias:true,alpha:true,powerPreference:'high-performance'});
if(!gl){status.textContent='This browser could not start 3D graphics. Try opening this page in Chrome or Edge, or open the Blender file below.';return;}
const vs=`#version 300 es
precision highp float;
layout(location=0) in vec3 aPosition;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec2 aUV;
uniform vec3 uCenter;
uniform mat3 uRotation;
uniform mat4 uProjection;
uniform vec2 uPan;
uniform float uDistance;
out vec3 vNormal;
out vec3 vPosition;
out vec3 vWoodPosition;
out vec3 vWoodNormal;
out vec2 vUV;
void main(){
 vUV=aUV;
 vWoodPosition=aPosition;
 vWoodNormal=aNormal;
 vec3 p=aPosition-uCenter;
 p=uRotation*vec3(p.x,p.z,-p.y);
 vPosition=p+vec3(uPan,-uDistance);
 vNormal=uRotation*vec3(aNormal.x,aNormal.z,-aNormal.y);
 gl_Position=uProjection*vec4(vPosition,1.0);
}`;
const fs=`#version 300 es
precision highp float;
in vec3 vNormal;
in vec3 vPosition;
in vec3 vWoodPosition;
in vec3 vWoodNormal;
in vec2 vUV;
uniform vec3 uColor;
uniform float uGloss;
uniform bool uOrthographic;
uniform bool uWood;
uniform sampler2D uWoodMap;
uniform vec3 uWoodParameters;
uniform vec4 uRootHeight;
uniform vec3 uRootRadiusGain;
out vec4 outColor;
float rootPigmentGain(vec3 p){
 float mask=smoothstep(uRootHeight.x,uRootHeight.y,p.z)
           *(1.0-smoothstep(uRootHeight.z,uRootHeight.w,p.z))
           *(1.0-smoothstep(uRootRadiusGain.x,uRootRadiusGain.y,length(p.xy)));
 return 1.0+(uRootRadiusGain.z-1.0)*mask;
}
float hash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float noise3(vec3 p){
 vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);
}
vec3 light(vec3 n,vec3 v,vec3 l,vec3 color,float strength,vec3 base){
 float diffuse=max(dot(n,l),0.0);
 vec3 h=normalize(l+v);
 float spec=pow(max(dot(n,h),0.0),uGloss)*step(0.001,diffuse);
 return strength*color*(base*diffuse+vec3(spec*0.25));
}
void main(){
 vec3 n=normalize(vNormal),v=uOrthographic?vec3(0.0,0.0,1.0):normalize(-vPosition);
 vec3 base=uColor;
 if(uWood){
  vec3 wood=pow(texture(uWoodMap,vec2(vUV.x,1.0-vUV.y)).rgb,vec3(2.2));
  float gray=dot(wood,vec3(0.2126,0.7152,0.0722));
  wood=mix(vec3(gray),wood,uWoodParameters.z)*uWoodParameters.y;
  base=mix(uColor,wood,uWoodParameters.x)*rootPigmentGain(vWoodPosition);
 }
 vec3 c=base*(0.19+0.06*n.y);
 c+=light(n,v,normalize(vec3(-0.65,0.9,1.25)),vec3(1.0,0.94,0.86),1.45,base);
 c+=light(n,v,normalize(vec3(0.85,0.2,0.9)),vec3(0.79,0.88,1.0),0.55,base);
 c+=light(n,v,normalize(vec3(0.45,0.75,-0.8)),vec3(0.9,0.95,1.0),0.8,base);
 c=clamp((c*(2.51*c+0.03))/(c*(2.43*c+0.59)+0.14),0.0,1.0);
 outColor=vec4(pow(c,vec3(1.0/2.2)),1.0);
}`;
let program,vao,uniforms,meshBytes,woodTexture,ready=false,lost=false,pending=false;
const woodImage=new Image();
woodImage.onload=()=>{if(ready&&!lost){uploadWood();schedule();}};
woodImage.src='data:image/png;base64,'+document.getElementById('wood-data').textContent.trim();
let q=[0,0,0,1],pan=[0,0],distance=9,material='neutral',autoFit=true;
let projection='orthographic',orthoHeight=6,activeView='overlay';
const reference=meta.referenceCamera;
const fov=40*Math.PI/180,tanHalf=Math.tan(fov/2);
const size=meta.bounds.size,radius=Math.hypot(...size)/2;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const normalize=a=>{const l=Math.hypot(...a);return a.map(v=>v/l);};
const mul=(a,b)=>[
 a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],
 a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
 a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],
 a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]
];
const axis=(x,y,z,a)=>[x*Math.sin(a/2),y*Math.sin(a/2),z*Math.sin(a/2),Math.cos(a/2)];
function referenceQuaternion(){
 // R maps Blender world to camera space. The shader first applies B:(x,y,z)->(x,z,-y),
 // so its quaternion must represent R*inverse(B), not an estimated Euler angle.
 const r=reference.worldToCamera.flat();
 const m00=r[0],m01=r[2],m02=-r[1],m10=r[4],m11=r[6],m12=-r[5],m20=r[8],m21=r[10],m22=-r[9];
 const trace=m00+m11+m22;let a,s;
 if(trace>0){s=2*Math.sqrt(trace+1);a=[(m21-m12)/s,(m02-m20)/s,(m10-m01)/s,s/4];}
 else if(m00>m11&&m00>m22){s=2*Math.sqrt(1+m00-m11-m22);a=[s/4,(m01+m10)/s,(m02+m20)/s,(m21-m12)/s];}
 else if(m11>m22){s=2*Math.sqrt(1+m11-m00-m22);a=[(m01+m10)/s,s/4,(m12+m21)/s,(m02-m20)/s];}
 else{s=2*Math.sqrt(1+m22-m00-m11);a=[(m02+m20)/s,(m12+m21)/s,s/4,(m10-m01)/s];}
 return normalize(a);
}
function rotation(){const [x,y,z,w]=q;return new Float32Array([
 1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w),
 2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w),
 2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y)
]);}
function fit(){
 const m=rotation(),aspect=Math.max(.01,canvas.clientWidth/canvas.clientHeight);let d=0,maxX=0,maxY=0;
 if(activeView==='overlay'){
  const r=reference.worldToCamera.flat(),p=reference.projectionMatrix.flat(),c=meta.bounds.center;
  const center=r.slice(0,12).reduce((rows,_,i)=>{if(i%4===0)rows.push(r[i]*c[0]+r[i+1]*c[1]+r[i+2]*c[2]+r[i+3]);return rows;},[]);
  // Fit the complete render frame to this viewport without stretching it. Keep
  // Blender's camera shifts and framing, including its off-center subject.
  orthoHeight=Math.max(2/p[5],(2/p[0])/aspect);
  pan=[center[0]+p[3]/p[0],center[1]+p[7]/p[5]];distance=-center[2];return;
 }
 for(const x of [-size[0]/2,size[0]/2])for(const y of [-size[2]/2,size[2]/2])for(const z of [-size[1]/2,size[1]/2]){
  const rx=m[0]*x+m[3]*y+m[6]*z,ry=m[1]*x+m[4]*y+m[7]*z,rz=m[2]*x+m[5]*y+m[8]*z;
  d=Math.max(d,Math.abs(rx)/(tanHalf*aspect)+rz,Math.abs(ry)/tanHalf+rz);
  maxX=Math.max(maxX,Math.abs(rx));maxY=Math.max(maxY,Math.abs(ry));
 }
 orthoHeight=2*Math.max(maxY,maxX/aspect)*1.22;
 distance=projection==='orthographic'?radius*5:d*1.22;pan=[0,0];
}
function updateLabels(){
 for(const name of ['orthographic','perspective'])document.getElementById(name).setAttribute('aria-pressed',String(projection===name));
  document.getElementById('surface-note').textContent=(activeView==='overlay'?'Overlay camera':projection==='orthographic'?'Orthographic view':'Perspective view')+' · '+(material==='brown'?'wood preview':'neutral surface');
}
function unselectViews(){activeView='';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed','false'));updateLabels();}
function view(name){
 const views={overlay:referenceQuaternion(),threequarter:mul(axis(1,0,0,25*Math.PI/180),axis(0,1,0,-25*Math.PI/180)),front:[0,0,0,1],side:axis(0,1,0,Math.PI/2),top:axis(1,0,0,Math.PI/2),bottom:axis(1,0,0,-Math.PI/2)};
 activeView=name;if(name==='overlay')projection='orthographic';
 q=views[name]||views.overlay;autoFit=true;fit();updateLabels();
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));
 schedule();
}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const info=gl.getShaderInfoLog(s);gl.deleteShader(s);throw new Error(info);}return s;}
// Base studies share the camera, UVs, atlas and buffer layout. Restore the
// evaluated mesh byte for byte, including triangles whose chosen diagonal moved.
let vertexBuffer, indexBuffer, originalBytes, activeStudy = 'socket';
const studyMeshes = new Map();
function uploadGeometry() {
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER,vertexBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(meshBytes.buffer,0,meta.vertexByteLength/4),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(meshBytes.buffer,meta.indexByteOffset,meta.indexCount),gl.STATIC_DRAW);
}
function studyMesh(id) {
  if (id === 'socket') return originalBytes;
  if (studyMeshes.has(id)) return studyMeshes.get(id);
  const encoded=document.getElementById(meta.baseStudies[id].patch);
  const raw=atob(encoded.textContent.trim());
  const patch=Uint8Array.from(raw,ch=>ch.charCodeAt(0));
  const header=new DataView(patch.buffer);
  if (raw.slice(0,4)!=='QBP1' || header.getUint32(4,true)!==originalBytes.length) throw Error('Invalid study mesh header');
  const result=originalBytes.slice(), runs=header.getUint32(8,true);
  let pos=12, previousEnd=0;
  for (let i=0;i<runs;i++) {
    const offset=header.getUint32(pos,true), len=header.getUint32(pos+4,true);
    pos+=8;
    if (offset<previousEnd || offset+len>result.length || pos+len>patch.length) throw Error('Invalid study mesh range');
    result.set(patch.subarray(pos,pos+len),offset);
    previousEnd=offset+len;
    pos+=len;
  }
  if (pos!==patch.length) throw Error('Invalid study mesh length');
  studyMeshes.set(id,result);
  encoded.remove();
  return result;
}
function selectStudy(id) {
  if (!meta.baseStudies || !Object.prototype.hasOwnProperty.call(meta.baseStudies,id) || !originalBytes) return;
  if (activeStudy!==id) {
    meshBytes=studyMesh(id);
    if (ready&&!lost) uploadGeometry();
    activeStudy=id;
  }
  document.getElementById('viewer-model-file').href=meta.baseStudies[id].download;
  document.documentElement.dataset.baseStudy=id;
}

function initialize(){
 const vert=shader(gl.VERTEX_SHADER,vs),frag=shader(gl.FRAGMENT_SHADER,fs);
 program=gl.createProgram();gl.attachShader(program,vert);gl.attachShader(program,frag);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
 gl.deleteShader(vert);gl.deleteShader(frag);
 vao=gl.createVertexArray();gl.bindVertexArray(vao);
 vertexBuffer=gl.createBuffer();indexBuffer=gl.createBuffer();uploadGeometry();
 for(let i=0;i<2;i++){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,meta.vertexStrideBytes,i*12);}
 gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,2,gl.FLOAT,false,meta.vertexStrideBytes,meta.uvOffsetBytes);

  uniforms={};for(const name of ['uCenter','uRotation','uProjection','uPan','uDistance','uColor','uGloss','uOrthographic','uWood','uWoodMap','uWoodParameters','uRootHeight','uRootRadiusGain'])uniforms[name]=gl.getUniformLocation(program,name);
  woodTexture=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,woodTexture);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([100,45,18,255]));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  if(woodImage.complete&&woodImage.naturalWidth)uploadWood();
 gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.clearColor(0,0,0,0);
 const error=gl.getError();if(error!==gl.NO_ERROR)throw new Error('WebGL upload error '+error);
 ready=true;status.hidden=true;schedule();
 if(window.parent&&window.parent!==window)window.parent.postMessage({channel:'listaunton-review',event:'viewer-ready'},'*');
}
 function uploadWood(){
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,woodTexture);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,woodImage);
  gl.generateMipmap(gl.TEXTURE_2D);
 }
function draw(){
 pending=false;if(!ready||lost)return;
 const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.bindVertexArray(vao);
 const f=1/tanHalf,n=radius*.01,far=radius*100;
 const cameraMatrix=projection==='orthographic'?
  [2/(orthoHeight*w/h),0,0,0,0,2/orthoHeight,0,0,0,0,-2/(far-n),0,0,0,-(far+n)/(far-n),1]:
  [f/(w/h),0,0,0,0,f,0,0,0,0,(far+n)/(n-far),-1,0,0,2*far*n/(n-far),0];
 gl.uniformMatrix4fv(uniforms.uProjection,false,new Float32Array(cameraMatrix));
 gl.uniformMatrix3fv(uniforms.uRotation,false,rotation());gl.uniform3fv(uniforms.uCenter,meta.bounds.center);
 gl.uniform2fv(uniforms.uPan,pan);gl.uniform1f(uniforms.uDistance,distance);
 gl.uniform1i(uniforms.uOrthographic,projection==='orthographic'?1:0);
  gl.uniform1i(uniforms.uWood,material==='brown'?1:0);
  const woodParams=meta.materialConfig||{};gl.uniform3fv(uniforms.uWoodParameters,[woodParams.image_mix??.78,woodParams.value??1,woodParams.saturation??1]);
  const rootPigment=woodParams.finial_root_pigment?.config;
  gl.uniform4fv(uniforms.uRootHeight,rootPigment?[...rootPigment.height_rise,...rootPigment.height_fall]:[0,1,2,3]);
  gl.uniform3fv(uniforms.uRootRadiusGain,rootPigment?[...rootPigment.radius_fall,rootPigment.gain]:[0,1,1]);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,woodTexture);gl.uniform1i(uniforms.uWoodMap,0);
 gl.uniform3fv(uniforms.uColor,material==='brown'?[.12,.045,.018]:[.24,.26,.29]);gl.uniform1f(uniforms.uGloss,material==='brown'?90:55);
 gl.drawElements(gl.TRIANGLES,meta.indexCount,gl.UNSIGNED_INT,0);
}
function schedule(){if(!pending){pending=true;requestAnimationFrame(draw);}}
function zoom(factor){autoFit=false;unselectViews();if(projection==='orthographic')orthoHeight=clamp(orthoHeight*factor,radius*.15,radius*40);else distance=clamp(distance*factor,radius*.8,radius*20);schedule();}
function shift(dx,dy){autoFit=false;unselectViews();const scale=(projection==='orthographic'?orthoHeight:2*distance*tanHalf)/canvas.clientHeight;pan[0]+=dx*scale;pan[1]-=dy*scale;schedule();}
function setProjection(name){
 if(name===projection)return;
 if(name==='orthographic')orthoHeight=2*distance*tanHalf;
 else distance=clamp(orthoHeight/(2*tanHalf),radius*.8,radius*20);
 projection=name;autoFit=false;unselectViews();schedule();
}
function ball(x,y){const r=canvas.getBoundingClientRect(),scale=.45*Math.min(r.width,r.height);x=(x-r.left-r.width/2)/scale;y=(r.height/2-y+r.top)/scale;const s=x*x+y*y;return normalize([x,y,s<=.5?Math.sqrt(1-s):.5/Math.sqrt(s)]);}
function turn(a,b){
 const dot=clamp(a[0]*b[0]+a[1]*b[1]+a[2]*b[2],-1,1);
 let delta=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0],1+dot];
 if(dot<-.999999){const orth=Math.abs(a[0])<.9?[1,0,0]:[0,1,0];delta=[a[1]*orth[2]-a[2]*orth[1],a[2]*orth[0]-a[0]*orth[2],a[0]*orth[1]-a[1]*orth[0],0];}
 autoFit=false;q=normalize(mul(normalize(delta),q));unselectViews();schedule();
}
const pointers=new Map();
function gesture(){const p=[...pointers.values()];return p.length<2?null:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==2)return;e.preventDefault();canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey});canvas.classList.add('dragging');});
canvas.addEventListener('pointermove',e=>{
 const old=pointers.get(e.pointerId);if(!old)return;e.preventDefault();const before=gesture();
 pointers.set(e.pointerId,{...old,x:e.clientX,y:e.clientY});const after=gesture();
 if(before&&after){if(before.d>3&&after.d>3)zoom(before.d/after.d);shift(after.x-before.x,after.y-before.y);}
 else if(old.pan||e.shiftKey)shift(e.clientX-old.x,e.clientY-old.y);
 else turn(ball(old.x,old.y),ball(e.clientX,e.clientY));
});
function release(e){pointers.delete(e.pointerId);if(!pointers.size)canvas.classList.remove('dragging');}
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,release);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?canvas.clientHeight:1;zoom(Math.exp(clamp(e.deltaY*unit,-300,300)*.0012));},{passive:false});
canvas.addEventListener('dblclick',()=>view('overlay'));
canvas.addEventListener('keydown',e=>{
 const keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','_','r','R'];if(!keys.includes(e.key))return;e.preventDefault();
 if(e.key.toLowerCase()==='r')view('overlay');else if(e.key==='+'||e.key==='=')zoom(.85);else if(e.key==='-'||e.key==='_')zoom(1/.85);
 else if(e.shiftKey)shift(e.key==='ArrowLeft'?-24:e.key==='ArrowRight'?24:0,e.key==='ArrowUp'?-24:e.key==='ArrowDown'?24:0);
 else{const angle=Math.PI/24;const d=e.key==='ArrowLeft'?axis(0,1,0,-angle):e.key==='ArrowRight'?axis(0,1,0,angle):e.key==='ArrowUp'?axis(1,0,0,-angle):axis(1,0,0,angle);autoFit=false;q=normalize(mul(d,q));unselectViews();schedule();}
});
document.getElementById('reset').onclick=()=>view('overlay');
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.getElementById('zoom-in').onclick=()=>zoom(.85);document.getElementById('zoom-out').onclick=()=>zoom(1/.85);
for(const name of ['orthographic','perspective'])document.getElementById(name).onclick=()=>setProjection(name);
for(const name of ['neutral','brown'])document.getElementById(name).onclick=()=>{material=name;for(const id of ['neutral','brown'])document.getElementById(id).setAttribute('aria-pressed',String(id===name));updateLabels();schedule();};
new ResizeObserver(()=>{if(autoFit)fit();schedule();}).observe(canvas);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;ready=false;status.hidden=false;status.textContent='3D graphics paused. Restoring the view…';});
canvas.addEventListener('webglcontextrestored',()=>{lost=false;try{initialize();}catch(e){fail(e);}});
function fail(error){status.hidden=false;status.textContent='The 3D view could not load. You can still open the Blender file below.';console.error(error);}
// Synchronize material when the parent selects the 3D tab; retain the orbit.
if(window.parent&&window.parent!==window)window.addEventListener('message',event=>{
 const data=event.data;
 if(event.source!==window.parent||!data||data.channel!=='listaunton-review'||data.action!=='activate')return;
 if(data.baseStudy)selectStudy(data.baseStudy);
 if(autoFit)fit();
 if(data.material==='neutral'||data.material==='brown')document.getElementById(data.material).onclick();
 schedule();
});
view(meta.baseStudies?'side':'overlay');
requestAnimationFrame(()=>setTimeout(()=>{try{
 const encoded=document.getElementById('mesh-data');const raw=atob(encoded.textContent.trim());meshBytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)meshBytes[i]=raw.charCodeAt(i);encoded.remove();originalBytes=meshBytes;
 if(meshBytes.byteLength!==meta.totalByteLength)throw new Error('Mesh size mismatch');initialize();
}catch(e){fail(e);}},0));
})();
</script>
</body>
