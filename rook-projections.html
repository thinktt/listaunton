let projection='orthographic',orthoHeight=6,activeView='front';
const decoded=new Map(),renderLayers=document.querySelectorAll('.render-layer');
const originalAlignment=config.originalAlignment,originalImage=document.getElementById('original-image'),frame=document.getElementById('comparison-frame');
originalImage.style.width=(100/originalAlignment.scale)+'%';originalImage.style.height=(100/originalAlignment.scale)+'%';originalImage.style.left=(-originalAlignment.x/originalAlignment.scale)+'%';originalImage.style.top=(-originalAlignment.y/originalAlignment.scale)+'%';
function fitComparison(){const side=Math.max(1,Math.min(stage.clientWidth,stage.clientHeight));frame.style.width=side+'px';frame.style.height=side+'px';}
document.getElementById('reference-choice').addEventListener('change',event=>{const original=event.target.value==='original';originalImage.hidden=!original;document.getElementById('reference-image').hidden=original;});
const opacity=document.getElementById('model-opacity');
function paintOverlay(){const value=Math.min(100,Math.max(0,Number(opacity.value)||0));renderLayers.forEach(image=>image.style.opacity=value/100);document.getElementById('opacity-value').textContent=value+'%';}
opacity.addEventListener('input',paintOverlay);
for(const [id,value] of [['reference-only',0],['half-overlay',50],['model-only',100]])document.getElementById(id).onclick=()=>{opacity.value=value;paintOverlay();};
function mode(name){
 stage.dataset.mode=name;
 for(const tab of ['profiles','rotate','compare'])document.getElementById(tab+'-tab').setAttribute('aria-pressed',String(tab===name));
 document.getElementById('profiles-controls').hidden=name!=='profiles';document.getElementById('rotation-controls').hidden=name!=='rotate';document.getElementById('comparison-controls').hidden=name!=='compare';
 canvas.tabIndex=name==='rotate'?0:-1;status.hidden=name!=='rotate'||ready;
 fitComparison();if(name==='rotate'){if(autoFit)fit();schedule();}
}
for(const name of ['profiles','rotate','compare'])document.getElementById(name+'-tab').onclick=()=>mode(name);
function selectVariant(id){
 if(!variants.has(id)||id===variant.id)return;
 variant=variants.get(id);meta=variant.meta;reference=meta.referenceCamera;
 document.querySelectorAll('button[data-variant]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.variant===id)));
 document.getElementById('model-download').href=variant.model;
 renderLayers.forEach(image=>image.hidden=image.dataset.variant!==id);
 // Preserve the camera already chosen by the user, including a former candidate's
 // reference view. Explicitly pressing "Its reference camera" loads this one's.
 if(activeView==='overlay'){autoFit=false;unselectViews();}
 if(ready&&!lost){try{uploadMesh();schedule();}catch(error){fail(error);}}
 updateLabels();
}
document.querySelectorAll('button[data-variant]').forEach(button=>{if(button.tagName==='BUTTON')button.onclick=()=>selectVariant(button.dataset.variant);});
function decodeMesh(){
 if(!decoded.has(variant.id)){
  const element=document.getElementById('mesh-'+variant.id),raw=atob(element.textContent.trim()),bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  if(bytes.byteLength!==meta.totalByteLength)throw new Error('Mesh size mismatch: '+variant.id);
  decoded.set(variant.id,bytes);element.remove();
 }
 return decoded.get(variant.id);
}
function uploadMesh(){
 meshBytes=decodeMesh();gl.bindVertexArray(vao);
 gl.bindBuffer(gl.ARRAY_BUFFER,vertexBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(meshBytes.buffer,0,meta.vertexByteLength/4),gl.STATIC_DRAW);
 for(let i=0;i<2;i++){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,meta.vertexStrideBytes,i*12);}
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(meshBytes.buffer,meta.indexByteOffset,meta.indexCount),gl.STATIC_DRAW);
}
fitComparison();paintOverlay();
const gl=canvas.getContext('webgl2',{antialias:true,alpha:true,powerPreference:'high-performance'});
if(!gl){new ResizeObserver(fitComparison).observe(stage);document.getElementById('rotate-tab').disabled=true;document.getElementById('rotate-tab').title='WebGL 2 is unavailable in this browser.';return;}
const vs=`#version 300 es
precision highp float;
layout(location=0) in vec3 aPosition;
layout(location=1) in vec3 aNormal;
uniform vec3 uCenter;
uniform mat3 uRotation;
uniform mat4 uProjection;
uniform vec2 uPan;
uniform float uDistance;
out vec3 vNormal;
out vec3 vPosition;
void main(){
 vec3 p=aPosition-uCenter;
 p=uRotation*vec3(p.x,p.z,-p.y);
 vPosition=p+vec3(uPan,-uDistance);
 vNormal=uRotation*vec3(aNormal.x,aNormal.z,-aNormal.y);
 gl_Position=uProjection*vec4(vPosition,1.0);
}`;
const fs=`#version 300 es
precision highp float;
in vec3 vNormal;
in vec3 vPosition;
uniform vec3 uColor;
uniform float uGloss;
uniform bool uOrthographic;
out vec4 outColor;
vec3 light(vec3 n,vec3 v,vec3 l,vec3 color,float strength){
 float diffuse=max(dot(n,l),0.0);
 vec3 h=normalize(l+v);
 float spec=pow(max(dot(n,h),0.0),uGloss)*step(0.001,diffuse);
 return strength*color*(uColor*diffuse+vec3(spec*0.25));
}
void main(){
 vec3 n=normalize(vNormal),v=uOrthographic?vec3(0.0,0.0,1.0):normalize(-vPosition);
 vec3 c=uColor*(0.19+0.06*n.y);
 c+=light(n,v,normalize(vec3(-0.65,0.9,1.25)),vec3(1.0,0.94,0.86),1.45);
 c+=light(n,v,normalize(vec3(0.85,0.2,0.9)),vec3(0.79,0.88,1.0),0.55);
 c+=light(n,v,normalize(vec3(0.45,0.75,-0.8)),vec3(0.9,0.95,1.0),0.8);
 c=clamp((c*(2.51*c+0.03))/(c*(2.43*c+0.59)+0.14),0.0,1.0);
 outColor=vec4(pow(c,vec3(1.0/2.2)),1.0);
}`;

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const normalize=a=>{const l=Math.hypot(...a);return a.map(v=>v/l);};
const mul=(a,b)=>[
 a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],
 a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
 a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],
 a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]
];
const axis=(x,y,z,a)=>[x*Math.sin(a/2),y*Math.sin(a/2),z*Math.sin(a/2),Math.cos(a/2)];
function referenceQuaternion(){
 // R maps Blender world to camera space. The shader first applies B:(x,y,z)->(x,z,-y),
 // so its quaternion must represent R*inverse(B), not an estimated Euler angle.
 const r=reference.worldToCamera.flat();
 const m00=r[0],m01=r[2],m02=-r[1],m10=r[4],m11=r[6],m12=-r[5],m20=r[8],m21=r[10],m22=-r[9];
 const trace=m00+m11+m22;let a,s;
 if(trace>0){s=2*Math.sqrt(trace+1);a=[(m21-m12)/s,(m02-m20)/s,(m10-m01)/s,s/4];}
 else if(m00>m11&&m00>m22){s=2*Math.sqrt(1+m00-m11-m22);a=[s/4,(m01+m10)/s,(m02+m20)/s,(m21-m12)/s];}
 else if(m11>m22){s=2*Math.sqrt(1+m11-m00-m22);a=[(m01+m10)/s,s/4,(m12+m21)/s,(m02-m20)/s];}
 else{s=2*Math.sqrt(1+m22-m00-m11);a=[(m02+m20)/s,(m12+m21)/s,s/4,(m10-m01)/s];}
 return normalize(a);
}
function rotation(){const [x,y,z,w]=q;return new Float32Array([
 1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w),
 2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w),
 2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y)
]);}
function fit(){
 const m=rotation(),aspect=Math.max(.01,canvas.clientWidth/canvas.clientHeight);let d=0,maxX=0,maxY=0;
 if(activeView==='overlay'){
  const r=reference.worldToCamera.flat(),p=reference.projectionMatrix.flat(),c=sharedCenter;
  const center=r.slice(0,12).reduce((rows,_,i)=>{if(i%4===0)rows.push(r[i]*c[0]+r[i+1]*c[1]+r[i+2]*c[2]+r[i+3]);return rows;},[]);
  // Fit the complete render frame to this viewport without stretching it. Keep
  // Blender's camera shifts and framing, including its off-center subject.
  orthoHeight=Math.max(2/p[5],(2/p[0])/aspect);
  pan=[center[0]+p[3]/p[0],center[1]+p[7]/p[5]];distance=-center[2];return;
 }
 for(const wx of [sharedBounds.min[0],sharedBounds.max[0]])for(const wy of [sharedBounds.min[1],sharedBounds.max[1]])for(const wz of [sharedBounds.min[2],sharedBounds.max[2]]){
  const x=wx-sharedCenter[0],y=wz-sharedCenter[2],z=-(wy-sharedCenter[1]);
  const rx=m[0]*x+m[3]*y+m[6]*z,ry=m[1]*x+m[4]*y+m[7]*z,rz=m[2]*x+m[5]*y+m[8]*z;
  d=Math.max(d,Math.abs(rx)/(tanHalf*aspect)+rz,Math.abs(ry)/tanHalf+rz);
  maxX=Math.max(maxX,Math.abs(rx));maxY=Math.max(maxY,Math.abs(ry));
 }
 orthoHeight=Math.max(config.sharedView.orthoHeight||0,2*Math.max(maxY,maxX/aspect)*1.16);
 distance=projection==='orthographic'?(config.sharedView.distance||radius*5):d*1.16;pan=[0,0];
}
function updateLabels(){
 for(const name of ['orthographic','perspective'])document.getElementById(name).setAttribute('aria-pressed',String(projection===name));
 document.getElementById('surface-note').textContent=variant.label+' · '+(activeView==='overlay'?'its reference camera':'shared viewing scale');
}
function unselectViews(){activeView='';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed','false'));updateLabels();}
function view(name){
 const views={overlay:referenceQuaternion(),threequarter:mul(axis(1,0,0,25*Math.PI/180),axis(0,1,0,-25*Math.PI/180)),front:[0,0,0,1],side:axis(0,1,0,Math.PI/2),top:axis(1,0,0,Math.PI/2),bottom:axis(1,0,0,-Math.PI/2)};
 activeView=name;if(name==='overlay')projection='orthographic';
 q=views[name]||views.overlay;autoFit=true;fit();updateLabels();
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));
 schedule();
}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const info=gl.getShaderInfoLog(s);gl.deleteShader(s);throw new Error(info);}return s;}
function initialize(){
 const vert=shader(gl.VERTEX_SHADER,vs),frag=shader(gl.FRAGMENT_SHADER,fs);
 program=gl.createProgram();gl.attachShader(program,vert);gl.attachShader(program,frag);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
 gl.deleteShader(vert);gl.deleteShader(frag);
 vao=gl.createVertexArray();gl.bindVertexArray(vao);
 vertexBuffer=gl.createBuffer();indexBuffer=gl.createBuffer();
 uploadMesh();
 uniforms={};for(const name of ['uCenter','uRotation','uProjection','uPan','uDistance','uColor','uGloss','uOrthographic'])uniforms[name]=gl.getUniformLocation(program,name);
 gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.clearColor(0,0,0,0);
 const error=gl.getError();if(error!==gl.NO_ERROR)throw new Error('WebGL upload error '+error);
 ready=true;status.hidden=true;schedule();
 if(window.parent&&window.parent!==window)window.parent.postMessage({channel:'listaunton-review',event:'viewer-ready'},'*');
}
function draw(){
 pending=false;if(!ready||lost)return;
 const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.bindVertexArray(vao);
 const f=1/tanHalf,n=radius*.01,far=radius*100;
 const cameraMatrix=projection==='orthographic'?
  [2/(orthoHeight*w/h),0,0,0,0,2/orthoHeight,0,0,0,0,-2/(far-n),0,0,0,-(far+n)/(far-n),1]:
  [f/(w/h),0,0,0,0,f,0,0,0,0,(far+n)/(n-far),-1,0,0,2*far*n/(n-far),0];
 gl.uniformMatrix4fv(uniforms.uProjection,false,new Float32Array(cameraMatrix));
 gl.uniformMatrix3fv(uniforms.uRotation,false,rotation());gl.uniform3fv(uniforms.uCenter,sharedCenter);
 gl.uniform2fv(uniforms.uPan,pan);gl.uniform1f(uniforms.uDistance,distance);
 gl.uniform1i(uniforms.uOrthographic,projection==='orthographic'?1:0);
 gl.uniform3fv(uniforms.uColor,material==='brown'?[.12,.045,.018]:[.24,.26,.29]);gl.uniform1f(uniforms.uGloss,material==='brown'?90:55);
 gl.drawElements(gl.TRIANGLES,meta.indexCount,gl.UNSIGNED_INT,0);
}
function schedule(){if(!pending){pending=true;requestAnimationFrame(draw);}}
function zoom(factor){autoFit=false;unselectViews();if(projection==='orthographic')orthoHeight=clamp(orthoHeight*factor,radius*.15,radius*40);else distance=clamp(distance*factor,radius*.8,radius*20);schedule();}
function shift(dx,dy){autoFit=false;unselectViews();const scale=(projection==='orthographic'?orthoHeight:2*distance*tanHalf)/canvas.clientHeight;pan[0]+=dx*scale;pan[1]-=dy*scale;schedule();}
function setProjection(name){
 if(name===projection)return;
 if(name==='orthographic')orthoHeight=2*distance*tanHalf;
 else distance=clamp(orthoHeight/(2*tanHalf),radius*.8,radius*20);
 projection=name;autoFit=false;unselectViews();schedule();
}
function ball(x,y){const r=canvas.getBoundingClientRect(),scale=.45*Math.min(r.width,r.height);x=(x-r.left-r.width/2)/scale;y=(r.height/2-y+r.top)/scale;const s=x*x+y*y;return normalize([x,y,s<=.5?Math.sqrt(1-s):.5/Math.sqrt(s)]);}
function turn(a,b){
 const dot=clamp(a[0]*b[0]+a[1]*b[1]+a[2]*b[2],-1,1);
 let delta=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0],1+dot];
 if(dot<-.999999){const orth=Math.abs(a[0])<.9?[1,0,0]:[0,1,0];delta=[a[1]*orth[2]-a[2]*orth[1],a[2]*orth[0]-a[0]*orth[2],a[0]*orth[1]-a[1]*orth[0],0];}
 autoFit=false;q=normalize(mul(normalize(delta),q));unselectViews();schedule();
}
const pointers=new Map();
function gesture(){const p=[...pointers.values()];return p.length<2?null:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==2)return;e.preventDefault();canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey});canvas.classList.add('dragging');});
canvas.addEventListener('pointermove',e=>{
 const old=pointers.get(e.pointerId);if(!old)return;e.preventDefault();const before=gesture();
 pointers.set(e.pointerId,{...old,x:e.clientX,y:e.clientY});const after=gesture();
 if(before&&after){if(before.d>3&&after.d>3)zoom(before.d/after.d);shift(after.x-before.x,after.y-before.y);}
 else if(old.pan||e.shiftKey)shift(e.clientX-old.x,e.clientY-old.y);
 else turn(ball(old.x,old.y),ball(e.clientX,e.clientY));
});
function release(e){pointers.delete(e.pointerId);if(!pointers.size)canvas.classList.remove('dragging');}
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,release);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?canvas.clientHeight:1;zoom(Math.exp(clamp(e.deltaY*unit,-300,300)*.0012));},{passive:false});
canvas.addEventListener('dblclick',()=>view('front'));
canvas.addEventListener('keydown',e=>{
 const keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','_','r','R'];if(!keys.includes(e.key))return;e.preventDefault();
 if(e.key.toLowerCase()==='r')view('front');else if(e.key==='+'||e.key==='=')zoom(.85);else if(e.key==='-'||e.key==='_')zoom(1/.85);
 else if(e.shiftKey)shift(e.key==='ArrowLeft'?-24:e.key==='ArrowRight'?24:0,e.key==='ArrowUp'?-24:e.key==='ArrowDown'?24:0);
 else{const angle=Math.PI/24;const d=e.key==='ArrowLeft'?axis(0,1,0,-angle):e.key==='ArrowRight'?axis(0,1,0,angle):e.key==='ArrowUp'?axis(1,0,0,-angle):axis(1,0,0,angle);autoFit=false;q=normalize(mul(d,q));unselectViews();schedule();}
});
document.getElementById('reset').onclick=()=>view('front');
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.getElementById('zoom-in').onclick=()=>zoom(.85);document.getElementById('zoom-out').onclick=()=>zoom(1/.85);
for(const name of ['orthographic','perspective'])document.getElementById(name).onclick=()=>setProjection(name);
for(const name of ['neutral','brown'])document.getElementById(name).onclick=()=>{material=name;for(const id of ['neutral','brown'])document.getElementById(id).setAttribute('aria-pressed',String(id===name));updateLabels();schedule();};
new ResizeObserver(()=>{fitComparison();if(autoFit)fit();schedule();}).observe(canvas);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;ready=false;status.hidden=stage.dataset.mode!=='rotate';status.textContent='3D graphics paused. Restoring the view…';});
canvas.addEventListener('webglcontextrestored',()=>{lost=false;try{initialize();}catch(e){fail(e);}});
function fail(error){status.hidden=stage.dataset.mode!=='rotate';status.textContent='The 3D view could not load. Profiles, overlays and the Blender download are still available.';console.error(error);}
view('front');
requestAnimationFrame(()=>setTimeout(()=>{try{initialize();}catch(error){fail(error);}},0));
})();
</script></body></html>
